name: Create agent baseline tag

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/create-agent-baseline-tag.yml

permissions:
  contents: write

jobs:
  create-baseline-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Create and verify permanent baseline tag
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: agent-baseline-2026-09-05
          TARGET_SHA: fcb5dc24a74c3b5b2c23af9ad10676752e7532a1
        shell: bash
        run: |
          set -euo pipefail

          if gh api "repos/$REPO/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists; verifying target."
          else
            gh api --method POST "repos/$REPO/git/refs" \
              -f ref="refs/tags/$TAG" \
              -f sha="$TARGET_SHA"
          fi

          actual_sha="$(gh api "repos/$REPO/git/ref/tags/$TAG" --jq '.object.sha')"

          if [ "$actual_sha" != "$TARGET_SHA" ]; then
            echo "Tag target mismatch: expected $TARGET_SHA, got $actual_sha" >&2
            exit 1
          fi

          echo "Verified $TAG -> $TARGET_SHA"
